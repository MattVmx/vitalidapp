<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title th:text="${titulo + ' | Vitalidapp'}">Error | Vitalidapp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
        crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/error.css}">
  <script th:src="@{/js/theme.js}"></script>
</head>
<body class="error-page-body">
<header class="error-header">
  <div class="container error-header__inner">
    <a th:href="@{/}" class="error-brand" aria-label="Vitalidapp, ir al inicio">
      <img th:src="@{/img/app_logo.png}" alt="Vitalidapp">
    </a>

    <button class="theme-toggle"
            type="button"
            data-theme-toggle
            aria-label="Activar tema oscuro"
            aria-pressed="false"
            title="Activar tema oscuro">
      <svg class="theme-toggle__icon theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.4 15.3A8.5 8.5 0 0 1 8.7 3.6 8.5 8.5 0 1 0 20.4 15.3Z"/>
      </svg>
      <svg class="theme-toggle__icon theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
      </svg>
      <span class="visually-hidden" data-theme-label>Activar tema oscuro</span>
    </button>
  </div>
</header>

<main class="error-main">
  <div class="container">
    <section class="error-card" aria-labelledby="error-title">
      <div class="error-card__content">
        <span class="error-eyebrow">
          <span aria-hidden="true"></span>
          No pudimos completar esta acción
        </span>

        <p class="error-code" th:text="${codigo}">404</p>
        <h1 id="error-title" th:text="${titulo}">Página no encontrada</h1>
        <p class="error-message" th:text="${mensaje}">
          No encontramos la página solicitada.
        </p>
        <p class="error-help">
          Podés volver al inicio o regresar a la pantalla anterior para continuar usando Vitalidapp.
        </p>

        <div class="error-actions">
          <a th:href="@{/}" class="btn btn-primary btn-lg">
            Volver al inicio <span aria-hidden="true">→</span>
          </a>
          <button type="button"
                  class="btn btn-outline-secondary btn-lg"
                  onclick="history.length > 1 ? history.back() : window.location.href='/'">
            <span aria-hidden="true">←</span> Volver atrás
          </button>
        </div>
      </div>

      <div class="error-card__visual" aria-hidden="true">
        <span class="error-visual__orb error-visual__orb--one"></span>
        <span class="error-visual__orb error-visual__orb--two"></span>
        <svg class="error-illustration" viewBox="0 0 420 360">
          <path class="error-illustration__route"
                d="M51 278c61-54 102-47 135-84 33-37 17-85 61-112 36-22 78-12 113-45"/>
          <circle class="error-illustration__point" cx="51" cy="278" r="9"/>
          <circle class="error-illustration__point" cx="360" cy="37" r="9"/>
          <g class="error-illustration__card">
            <rect x="117" y="82" width="190" height="176" rx="28"/>
            <path d="M167 159h90"/>
            <path d="M167 190h64"/>
            <circle cx="212" cy="126" r="18"/>
            <path d="m204 118 16 16M220 118l-16 16"/>
          </g>
          <path class="error-illustration__plus" d="M330 235v34M313 252h34"/>
          <path class="error-illustration__plus error-illustration__plus--small" d="M78 91v22M67 102h22"/>
        </svg>
        <div class="error-visual__label">
          <span></span>
          El resto de la aplicación sigue disponible
        </div>
      </div>
    </section>
  </div>
</main>

<footer class="error-footer">
  <div class="container">
    <p>© 2026 Vitalidapp · Atención simple y segura.</p>
  </div>
</footer>
</body>
</html>
