<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Completá o actualizá tu perfil de paciente en Vitalidapp.">
  <title>Perfil de paciente | Vitalidapp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
        crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/perfiles.css}">
  <script th:src="@{/js/preview_img.js}" defer></script>
  <script th:src="@{/js/limite_tamanio.js}" defer></script>
</head>
<body class="profile-page-body">
<header th:replace="fragments/navbar :: nav_bar"></header>

<main class="profile-page">
  <div class="container">
    <div class="profile-page__heading">
      <span class="eyebrow">Mi cuenta</span>
      <h1 th:text="${tipo == 'Usuario' ? 'Completá tu perfil de paciente' : 'Actualizá tus datos personales'}"></h1>
      <p>Esta información nos permite mostrarte opciones y turnos acordes a tu cobertura.</p>
    </div>

    <form class="profile-shell"
          th:action="@{/paciente/registro}"
          method="POST"
          enctype="multipart/form-data">
      <aside class="profile-photo-panel">
        <span class="profile-photo-panel__role">Perfil de paciente</span>
        <div class="profile-avatar">
          <img id="previewImg"
               alt="Imagen del perfil"
               th:if="${tipo == 'Usuario'}"
               th:src="@{/img/defaultProfile.jpg}">
          <img id="previewImg"
               alt="Imagen del perfil"
               th:if="${tipo != 'Usuario'}"
               th:src="@{/perfil/imagen}">
          <span class="profile-avatar__badge" aria-hidden="true">＋</span>
        </div>

        <strong class="profile-photo-panel__email"
                th:if="${tipo == 'Paciente'}"
                th:text="${paciente.email}"></strong>
        <strong class="profile-photo-panel__email"
                th:if="${tipo == 'Usuario'}"
                th:text="${usuario.email}"></strong>

        <input class="profile-file-input"
               type="file"
               name="imagen"
               id="formFile"
               accept="image/*"
               onchange="validarTamanoArchivo(); actualizarVistaPrevia();">
        <label for="formFile" class="profile-upload-button">Elegir imagen</label>
        <p id="mensaje-error" class="profile-upload-help">PNG o JPG de hasta 1 MB.</p>
      </aside>

      <section class="profile-form-panel" aria-labelledby="patient-data-title">
        <div class="profile-form-panel__heading">
          <div>
            <span>Datos personales</span>
            <h2 id="patient-data-title">Información del paciente</h2>
          </div>
          <span class="profile-form-panel__required">Todos los campos son obligatorios</span>
        </div>

        <div class="profile-grid">
          <div class="profile-field">
            <label for="paciente-nombre">Nombre</label>
            <input id="paciente-nombre"
                   type="text"
                   class="form-control"
                   name="nombre"
                   placeholder="Alberto Juan"
                   th:if="${tipo == 'Paciente'}"
                   th:value="${paciente.nombre}"
                   required>
            <input id="paciente-nombre"
                   type="text"
                   class="form-control"
                   name="nombre"
                   placeholder="Alberto Juan"
                   th:if="${tipo == 'Usuario'}"
                   required>
          </div>

          <div class="profile-field">
            <label for="paciente-apellido">Apellido</label>
            <input id="paciente-apellido"
                   type="text"
                   class="form-control"
                   name="apellido"
                   placeholder="Cáseres"
                   th:if="${tipo == 'Paciente'}"
                   th:value="${paciente.apellido}"
                   required>
            <input id="paciente-apellido"
                   type="text"
                   class="form-control"
                   name="apellido"
                   placeholder="Cáseres"
                   th:if="${tipo == 'Usuario'}"
                   required>
          </div>

          <div class="profile-field">
            <label for="paciente-domicilio">Domicilio</label>
            <input id="paciente-domicilio"
                   type="text"
                   class="form-control"
                   name="domicilio"
                   placeholder="San Martín 1150"
                   th:if="${tipo == 'Paciente'}"
                   th:value="${paciente.domicilio}"
                   required>
            <input id="paciente-domicilio"
                   type="text"
                   class="form-control"
                   name="domicilio"
                   placeholder="San Martín 1150"
                   th:if="${tipo == 'Usuario'}"
                   required>
          </div>

          <div class="profile-field">
            <label for="paciente-dni">DNI</label>
            <input id="paciente-dni"
                   type="number"
                   class="form-control"
                   name="dni"
                   placeholder="30123456"
                   min="0"
                   th:if="${tipo == 'Paciente'}"
                   th:value="${paciente.dni}"
                   required>
            <input id="paciente-dni"
                   type="number"
                   class="form-control"
                   name="dni"
                   placeholder="30123456"
                   min="0"
                   th:if="${tipo == 'Usuario'}"
                   required>
          </div>

          <div class="profile-field">
            <label for="paciente-sexo">Sexo</label>
            <select id="paciente-sexo"
                    class="form-select"
                    name="sexo"
                    th:if="${tipo == 'Paciente'}"
                    required>
              <option th:each="sexo : ${sexos}"
                      th:value="${sexo}"
                      th:text="${#strings.capitalize(sexo.toString().toLowerCase())}"
                      th:selected="${paciente.sexo == sexo}"></option>
            </select>
            <select id="paciente-sexo"
                    class="form-select"
                    name="sexo"
                    th:if="${tipo == 'Usuario'}"
                    required>
              <option th:each="sexo : ${sexos}"
                      th:value="${sexo}"
                      th:text="${#strings.capitalize(sexo.toString().toLowerCase())}"></option>
            </select>
          </div>

          <div class="profile-field">
            <label for="fecha">Fecha de nacimiento</label>
            <input id="fecha"
                   class="form-control"
                   type="date"
                   name="fechaNacimiento"
                   th:if="${tipo == 'Paciente'}"
                   th:value="${#dates.format(paciente.fechaNacimiento, 'yyyy-MM-dd')}"
                   required>
            <input id="fecha"
                   class="form-control"
                   type="date"
                   name="fechaNacimiento"
                   th:if="${tipo == 'Usuario'}"
                   required>
          </div>

          <div class="profile-field profile-field--wide">
            <label for="paciente-obra-social">Obra social</label>
            <select id="paciente-obra-social"
                    class="form-select"
                    name="obraSocialNombre"
                    th:if="${tipo == 'Paciente'}"
                    required>
              <option th:each="obraSocial : ${obrasSociales}"
                      th:value="${obraSocial}"
                      th:text="${obraSocial}"
                      th:selected="${obraSocial == paciente.obraSocial.nombre}"></option>
            </select>
            <select id="paciente-obra-social"
                    class="form-select"
                    name="obraSocialNombre"
                    th:if="${tipo == 'Usuario'}"
                    required>
              <option th:each="obraSocial : ${obrasSociales}"
                      th:value="${obraSocial}"
                      th:text="${obraSocial}"></option>
            </select>
            <small>La cobertura se utiliza para calcular el valor final de la consulta.</small>
          </div>
        </div>

        <div class="profile-actions">
          <a th:href="@{/}" class="btn btn-soft btn-lg">Cancelar</a>
          <button type="submit"
                  class="btn btn-primary btn-lg"
                  th:text="${tipo == 'Usuario' ? 'Completar perfil' : 'Guardar cambios'}"></button>
        </div>
      </section>
    </form>
  </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>

<script th:src="@{/js/today.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>
</body>
</html>
